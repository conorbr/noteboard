# Builds prebuilt binaries and attaches them to a GitHub Release.
# Runs on a pushed `v*` tag, or by hand for an existing tag:
#   gh workflow run release.yml -f tag=v0.5.0
# Add `-f dry_run=true` to build and collect everything without publishing.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. v0.5.0"
        required: true
      dry_run:
        description: "Build and collect the binaries, but don't publish"
        type: boolean
        default: false

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check the tag matches the crate version
        shell: bash
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          if [ "v$crate" != "$TAG" ]; then
            echo "::error::tag $TAG does not match version $crate in Cargo.toml"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --package noteboard

      - name: Package
        shell: bash
        run: |
          name="noteboard-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/noteboard" README.md LICENSE CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List what would be published
        run: ls -l dist && (cd dist && sha256sum -c *.sha256)

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "noteboard ${TAG#v}" \
              --notes "Install with \`brew install conorbr/tap/noteboard\` or \`curl -fsSL https://raw.githubusercontent.com/conorbr/noteboard/main/scripts/install.sh | sh\`, or download the binary for your platform below."
          fi
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
